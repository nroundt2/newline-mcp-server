deploy:
  commands:
    - type: pushreleasetogithubdotcom
      config:
        targetEnvironment: "prod"
        applicationName: "newline"
        tagToRelease: "v0.1.0"
      githubRepoName: "newline-mcp-server"
      githubOrg: "newline53"
      hashivault:
        - config:
            vaultURL: "https://vault-m1.ise-secdev-prod.nube.53.com"
            id: "8dnk39dh-iunb3td-o93bt9-be920"
            engineVersion: 2
        - secrets:
            - path: "kv/ne4311/github-public"
              env: prod
              engineVersion: 2
              secretValues:
                - envVar: "GITHUB_DOT_COM_API_KEY"
                  vaultKey: "github_remote_api_token"
